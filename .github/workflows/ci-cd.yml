name: CI/CD Pipeline

on:
  push:
    branches: [app-and-tests]
  pull_request:
    branches: [app-and-tests]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -v --junitxml=test-results.xml

      - name: Write CI step summary
        if: always()
        run: |
          {
            echo "## ⚙️ CI Pipeline Summary"
            echo ""
            echo "| Metric | Details |"
            echo "| --- | --- |"
            echo "| **Environment** | Staging |"
            echo "| **Working Directory** | \`backend/\` |"
            echo "| **Python Version** | \`3.12\` |"
            echo "| **Trigger Event** | \`${GITHUB_EVENT_NAME}\` |"
            echo "| **Commit SHA** | \`${GITHUB_SHA::7}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/test-results.xml
          retention-days: 7