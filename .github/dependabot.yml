version: 2
updates:
  # Keep the GitHub Actions we use up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Keep Python packages up to date
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"

  # Keep base images in backend Dockerfile up to date
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"

  # Keep base images in frontend Dockerfile up to date
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"